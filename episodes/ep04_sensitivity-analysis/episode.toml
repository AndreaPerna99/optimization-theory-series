# Keep the Gradient - Episode 4 manifest
#
# The [[timeline]] list IS the cut: entries play in this order, and recutting
# the episode means editing this list (never copying scene folders). An entry
# is either a manim scene, scene = "file.py:ClassName" under scenes/, or a
# finished clip, clip = "assets/footage/name.mp4" under this folder.
# Validate with: ./kg check 4

[episode]
number = 4
slug = "sensitivity-analysis"
title = "What If the World Changes? Sensitivity Analysis"
status = "planned"        # planned | scripting | animating | narrating | review | published
target_minutes = "15–20"
from_pdf = "Video 3, second half"
depends_on = [3]      # episodes a viewer should have watched first

[[timeline]]
scene = "s00_title.py:Title"

[[timeline]]
scene = "s01_hook_world_changes.py:HookWorldChanges"

[[timeline]]
scene = "s02_multiplier_derivative.py:MultiplierDerivative"

[[timeline]]
scene = "s03_envelope.py:Envelope"

[[timeline]]
scene = "s04_kinks.py:Kinks"

[[timeline]]
scene = "s05_jumps.py:Jumps"

[[timeline]]
scene = "s06_applications.py:Applications"

[[timeline]]
scene = "s07_trajectory_sensitivity.py:TrajectorySensitivity"

[[timeline]]
scene = "s08_recap_closing.py:RecapClosing"
