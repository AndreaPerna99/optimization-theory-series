# Keep the Gradient - Episode 7 manifest
#
# The [[timeline]] list IS the cut: entries play in this order, and recutting
# the episode means editing this list (never copying scene folders). An entry
# is either a manim scene, scene = "file.py:ClassName" under scenes/, or a
# finished clip, clip = "assets/footage/name.mp4" under this folder.
# Validate with: ./kg check 7

[episode]
number = 7
slug = "graphs-consensus"
title = "Many Minds: Graphs and Consensus"
status = "planned"        # planned | scripting | animating | narrating | review | published
target_minutes = "~20"
from_pdf = "Video 5, first half"
depends_on = [1]      # episodes a viewer should have watched first

[[timeline]]
scene = "s00_title.py:Title"

[[timeline]]
scene = "s01_hook_agreement.py:HookAgreement"

[[timeline]]
scene = "s02_why_distributed.py:WhyDistributed"

[[timeline]]
scene = "s03_graphs_matrices.py:GraphsMatrices"

[[timeline]]
scene = "s04_average_consensus.py:AverageConsensus"

[[timeline]]
scene = "s05_consensus_is_gd.py:ConsensusIsGd"

[[timeline]]
scene = "s06_connectivity_speed.py:ConnectivitySpeed"

[[timeline]]
scene = "s07_directed_flocking.py:DirectedFlocking"

[[timeline]]
scene = "s08_leaders_containment.py:LeadersContainment"

[[timeline]]
scene = "s09_recap_closing.py:RecapClosing"
